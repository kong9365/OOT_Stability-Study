[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-custom-mcp"
version = "0.1.0"
description = "Tableau Personal Access Token을 사용하는 커스텀 MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0"
]

[project.scripts]
tableau-custom-mcp = "tableau_custom_mcp.server:main"
